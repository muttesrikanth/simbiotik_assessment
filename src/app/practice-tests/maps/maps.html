<div class="flex flex-col h-screen">
  <div class="p-4 bg-gray-100 shadow-md">
    <h2
      class="text-3xl font-bold text-center bg-gradient-to-r from-indigo-500 via-purple-500 to-pink-500 text-transparent bg-clip-text">
      Route Finder
    </h2>

    <div class="flex gap-2 mb-3">
      <input [(ngModel)]="fromCity" placeholder="From city (or click map)"
        class="border p-2 rounded w-1/2 focus:ring focus:ring-blue-300" />
      <input [(ngModel)]="toCity" placeholder="To city (or click map)"
        class="border p-2 rounded w-1/2 focus:ring focus:ring-blue-300" />
    </div>

    <div class="flex gap-2">
      <button (click)="calculateRoute()" [disabled]="loading()"
        class="bg-blue-600 hover:bg-blue-700 disabled:bg-gray-400 text-white px-4 py-2 rounded transition-all">
        Find Route
      </button>
      <button (click)="resetMap()" class="bg-red-500 hover:bg-red-600 text-white px-4 py-2 rounded transition-all">
        Reset
      </button>
    </div>
    @if(loading()){
    <div class="mt-3 flex items-center gap-2 text-blue-600">
      <div class="animate-spin rounded-full h-5 w-5 border-t-2 border-b-2 border-blue-600"></div>
      <span>Calculating route...</span>
    </div>
    } @if(distance()){
    <div class="mt-3 p-3 bg-white rounded shadow-sm">
      <p><strong>Distance:</strong> {{ distance() }}</p>
      <p><strong>Duration:</strong> {{ duration() }}</p>
    </div>
    }
  </div>
  <div id="map" class="flex-1"></div>
</div>
